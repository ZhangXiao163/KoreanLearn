s": "形容词", "pron": "-", "source": "核心词汇", "zh": "有名 / 著名", "example": "경주는 역사가 깊은 유명한 도시예요. (庆州是历史悠久的著名城市。)"}, {"ko": "지도", "pos": "名词", "pron": "-", "source": "拓展词汇", "zh": "地图", "example": "스마트폰 지도를 보고 길을 찾았어요. (看着手机地图找到了路。)"}, {"ko": "관광객", "pos": "名词", "pron": "[관광객]", "source": "拓展词汇", "zh": "游客 / 观光客", "example": "명동에는 외국인 관광객이 아주 많아요. (明洞有非常多外国游客。)"}, {"ko": "안내소", "pos": "名词", "pron": "-", "source": "拓展词汇", "zh": "咨询处 / 问讯处", "example": "관광 안내소에서 여행 지도를 받았어요. (在旅游咨询处领了旅游地图。)"}, {"ko": "기념품", "pos": "名词", "pron": "-", "source": "拓展词汇", "zh": "纪念品", "example": "친구들에게 줄 기념품을 샀어요. (买了要送给朋友们的纪念品。)"}, {"ko": "특산물", "pos": "名词", "pron": "[특싼물]", "source": "拓展词汇", "zh": "特产", "example": "제주도의 대표적인 특산물은 귤이에요. (济州岛的代表性特产是橘子。)"}, {"ko": "박물관", "pos": "名词", "pron": "[방물관]", "source": "拓展词汇", "zh": "博物馆", "example": "국립중앙박물관에 가서 역사를 배웠어요. (去了国立中央博物馆学习历史。)"}, {"ko": "놀이공원", "pos": "名词", "pron": "-", "source": "拓展词汇", "zh": "游乐园", "example": "주말에 친구들과 놀이공원에 갈 거예요. (周末要和朋友们去游乐园。)"}, {"ko": "온천", "pos": "名词", "pron": "-", "source": "拓展词汇", "zh": "温泉", "example": "겨울에는 따뜻한 온천에 가고 싶어요. (冬天想去温暖的温泉。)"}, {"ko": "환전하다", "pos": "动词", "pron": "-", "source": "拓展词汇", "zh": "换钱 / 兑换外币", "example": "은행에서 달러를 한국 돈으로 환전했어요. (在银行把美元换成了韩元。)"}, {"ko": "추억", "pos": "名词", "pron": "-", "source": "拓展词汇", "zh": "回忆", "example": "이번 여행은 잊지 못할 좋은 추억이 되었어요. (这次旅行成了难忘的美好回忆。)"}]}, {"id": "1B-16", "book": "1B", "number": 16, "topic": "餐厅与点餐", "koreanTitle": "불고기 2인분 주세요", "title": "1B 第16课 · 餐厅与点餐", "words": [{"ko": "음식", "pos": "名词", "pron": "-", "source": "核心词汇", "zh": "食物 / 饮食", "example": "한국 음식 중에서 뭘 제일 좋아해요? (韩国食物中最喜欢什么？)"}, {"ko": "메뉴", "pos": "名词", "pron": "-", "source": "核心词汇", "zh": "菜单", "example": "여기 메뉴판 좀 주세요. (请给我一下菜单。)"}, {"ko": "인분", "pos": "依存名词", "pron": "-", "source": "核心词汇", "zh": "人份", "example": "삼겹살 3인분 주세요. (请给我三人份五花肉。)"}, {"ko": "불고기", "pos": "名词", "pron": "-", "source": "核心词汇", "zh": "烤肉（韩式甜口牛肉）", "example": "불고기는 맵지 않아서 외국인도 좋아해요. (烤肉不辣，外国人也喜欢。)"}, {"ko": "비빔밥", "pos": "名词", "pron": "[비빔빱]", "source": "核心词汇", "zh": "拌饭", "example": "전주 비빔밥이 아주 유명해요. (全州拌饭非常有名。)"}, {"ko": "김치찌개", "pos": "名词", "pron": "-", "source": "核心词汇", "zh": "泡菜汤 / 泡菜锅", "example": "김치찌개가 조금 맵지만 맛있어요. (泡菜汤虽然有点辣，但很好吃。)"}, {"ko": "된장찌개", "pos": "名词", "pron": "-", "source": "核心词汇", "zh": "大酱汤", "example": "점심에 된장찌개를 먹었어요. (午饭吃了大酱汤。)"}, {"ko": "냉면", "pos": "名词", "pron": "-", "source": "核心词汇", "zh": "冷面", "example": "더운 여름에는 시원한 냉면이 최고예요. (炎热的夏天，凉爽的冷面最棒了。)"}, {"ko": "갈비탕", "pos": "名词", "pron": "-", "source": "核心词汇", "zh": "排骨汤", "example": "갈비탕 국물이 아주 시원하고 맛있어요. (排骨汤的汤汁很鲜美。)"}, {"ko": "주문하다", "pos": "动词", "pron": "-", "source": "核心词汇", "zh": "点餐 / 订购", "example": "저기요, 주문 좀 할게요. (服务员，我们要点餐。)"}, {"ko": "맛있다", "pos": "形容词", "pron": "[마싣따]", "source": "核心词汇", "zh": "好吃 / 美味", "example": "이 식당 음식이 정말 맛있어요. (这家餐厅的菜真好吃。)"}, {"ko": "맛없다", "pos": "形容词", "pron": "[마덥따]", "source": "核心词汇", "zh": "难吃 / 不好吃", "example": "너무 짜서 좀 맛없었어요. (太咸了，有点不好吃。)"}, {"ko": "맵다", "pos": "形容词", "pron": "[맵따]", "source": "核心词汇", "zh": "辣", "example": "떡볶이가 너무 매워서 물을 많이 마셨어요. (炒年糕太辣了，喝了很多水。)"}, {"ko": "달다", "pos": "形容词", "pron": "-", "source": "核心词汇", "zh": "甜", "example": "이 케이크는 많이 달지 않아서 좋아요. (这个蛋糕不太甜，很好吃。)"}, {"ko": "짜다", "pos": "形容词", "pron": "-", "source": "核心词汇", "zh": "咸", "example": "국물이 조금 짜니까 물을 좀 넣으세요. (汤有点咸，加点水吧。)"}, {"ko": "싱겁다", "pos": "形容词", "pron": "[싱겁따]", "source": "核心词汇", "zh": "淡（味道淡）", "example": "음식이 싱거우면 소금을 더 넣으세요. (菜如果淡的话，再加点盐吧。)"}, {"ko": "쓰다", "pos": "形容词", "pron": "-", "source": "核心词汇", "zh": "苦", "example": "약이 너무 써서 먹기 힘들어요. (药太苦了，很难咽下去。)"}, {"ko": "시다", "pos": "形容词", "pron": "-", "source": "核心词汇", "zh": "酸", "example": "이 레몬은 너무 셔서 못 먹겠어요. (这个柠檬太酸了，吃不了。)"}, {"ko": "반찬", "pos": "名词", "pron": "-", "source": "拓展词汇", "zh": "小菜 / 配菜", "example": "한국 식당은 반찬을 무료로 더 줘요. (韩国餐厅小菜可以免费续加。)"}, {"ko": "숟가락", "pos": "名词", "pron": "[숟까락]", "source": "拓展词汇", "zh": "勺子", "example": "한국에서는 밥과 국을 숟가락으로 먹어요. (在韩国用勺子吃饭和喝汤。)"}, {"ko": "젓가락", "pos": "名词", "pron": "[젇까락]", "source": "拓展词汇", "zh": "筷子", "example": "반찬은 젓가락으로 집어 먹어요. (小菜用筷子夹着吃。)"}, {"ko": "접시", "pos": "名词", "pron": "[접씨]", "source": "拓展词汇", "zh": "盘子 / 碟子", "example": "앞접시 좀 몇 개 갖다 주세요. (请拿几个小分餐碟过来。)"}, {"ko": "냅킨 / 휴지", "pos": "名词", "pron": "-", "source": "拓展词汇", "zh": "餐巾纸 / 纸巾", "example": "테이블 서랍 안에 냅킨과 수저가 있어요. (桌子抽屉里有餐巾纸和餐具。)"}, {"ko": "떡볶이", "pos": "名词", "pron": "[떡뽀끼]", "source": "拓展词汇", "zh": "炒年糕", "example": "학교 앞에서 친구들과 떡볶이를 먹었어요. (在学校前面和朋友们吃了炒年糕。)"}, {"ko": "김밥", "pos": "名词", "pron": "[김빱]", "source": "拓展词汇", "zh": "紫菜包饭", "example": "소풍 갈 때 김밥을 싸 가지고 가요. (去郊游时包紫菜包饭带着去。)"}, {"ko": "삼계탕", "pos": "名词", "pron": "-", "source": "拓展词汇", "zh": "参鸡汤", "example": "한국 사람들은 복날에 삼계탕을 먹어요. (韩国人在三伏天吃参鸡汤。)"}, {"ko": "계산하다", "pos": "动词", "pron": "-", "source": "拓展词汇", "zh": "结账 / 买单", "example": "제가 오늘 점심값을 계산할게요. (今天午饭钱我来结账吧。)"}, {"ko": "배가 부르다", "pos": "词组", "pron": "-", "source": "拓展词汇", "zh": "吃饱了", "example": "너무 많이 먹어서 배가 불러요. (吃太多了，肚子好饱。)"}]}], "readings": [{"unitId": "1A-1", "label": "1A 第1课 问候介绍", "title": "자기소개 (自我介绍)", "ko": "안녕하세요? 처음 뵙겠습니다. 제 이름은 왕밍입니다. 저는 중국 사람이고, 지금 서울에서 한국어를 배우는 대학교 학생입니다. 우리 반에는 미국 사람, 일본 사람, 그리고 영국에서 온 친구도 있습니다. 김 선생님은 아주 친절한 한국어 선생님이십니다. 제 형은 서울에 있는 큰 회사에 다니는 회사원이고, 언니는 병원에서 일하는 간호사입니다. 만나서 정말 반갑습니다. 앞으로 잘 부탁드립니다. 감사합니다!", "zh": "您好？初次见面。我的名字叫王明。我是中国人，现在是在首尔学习韩语的大学生。我们班里有美国人、日本人，还有来自英国的朋友。金老师是非常亲切的韩语老师。我哥哥是在首尔一家大公司上班的职员，姐姐是在医院工作的护士。见到大家真的很高兴。今后请多多关照。谢谢！", "grammar": "重点句型：-이에요/예요（是）、-에서 오다（来自……）、-고（连接词尾，表并列）"}, {"unitId": "1A-2", "label": "1A 第2课 物品场所", "title": "내 가방과 우리 학교 (我的书包和我们学校)", "ko": "제 가방 안에는 한국어 책, 공책, 필통, 그리고 지갑이 있습니다. 필통 안에는 연필, 볼펜, 지우개가 들어 있습니다. 저는 책을 읽을 때 항상 안경을 씁니다. 책상 위에는 노트북과 휴대폰, 그리고 집 열쇠가 있습니다. 여기는 우리 학교 교실입니다. 교실 앞에는 큰 칠판이 있고, 벽에는 시계가 걸려 있습니다. 수업이 끝나면 저는 보통 학교 도서관에 가서 숙제를 합니다. 기숙사는 도서관 바로 근처에 있어서 아주 편리합니다.", "zh": "我的书包里有韩语书、笔记本、笔袋，还有钱包。笔袋里装着铅笔、圆珠笔和橡皮。我看书的时候总是戴眼镜。书桌上有笔记本电脑、手机，还有家门钥匙。这里是我们学校的教室。教室前面有大黑板，墙上挂着钟。下课后我通常去学校图书馆做作业。宿舍就在图书馆附近，所以非常方便。", "grammar": "重点句型：-에 있다/없다（在/有……）、-(으)ㄹ 때（……的时候）、-아서/어서（因为……所以……）"}, {"unitId": "1A-3", "label": "1A 第3课 日常动作", "title": "나의 하루 일과 (我的一天日程)", "ko": "저는 매일 아침 7시에 일어납니다. 일어나서 바로 세수를 하고, 아침으로 빵과 우유를 먹습니다. 가끔 따뜻한 녹차나 커피도 한 잔 마십니다. 오전 9시에 학교에 가서 한국어를 공부하고, 김 선생님께 한국 문화를 배웁니다. 점심에는 학생 식당에서 친구들과 같이 비빔밥을 먹습니다. 오후에는 도서관에서 책을 읽거나 공책을 보면서 숙제를 합니다. 저녁 식사 후에는 공원에서 운동을 하고, 밤에는 좋아하는 한국 음악을 들으면서 잠을 잡니다.", "zh": "我每天早上7点起床。起床后马上洗脸，早饭吃面包和牛奶。偶尔也会喝一杯热绿茶或咖啡。上午9点去学校学习韩语，向金老师学习韩国文化。午饭在学生食堂和朋友们一起吃拌饭。下午在图书馆看书或者看着笔记本做作业。晚饭后在公园运动，晚上听着喜欢的韩国音乐睡觉。", "grammar": "重点句型：-을/를（宾格助词）、-거나（或者）、-(으)면서（一边……一边……）"}, {"unitId": "1A-4", "label": "1A 第4课 位置方位", "title": "우리 동네 소개 (介绍我们小区)", "ko": "우리 집은 지하철역 근처에 있습니다. 지하철역에서 나와서 오른쪽으로 조금만 걸어가면 큰 은행이 보입니다. 은행과 우체국 사이에는 제가 자주 가는 예쁜 카페가 있습니다. 카페 건너편에는 24시간 문을 여는 편의점과 작은 빵집이 있습니다. 그 건물 3층에는 한국어 학원이 있고, 지하 1층에는 맛있는 식당가가 있습니다. 집 뒤쪽에는 넓은 공원과 미술관이 있어서 주말마다 산책하기에 정말 좋습니다.", "zh": "我家在地铁站附近。从地铁站出来往右边走一点点，就能看到一家大银行。银行和邮局之间有一家我常去的漂亮咖啡厅。咖啡厅对面有24小时营业的便利店和小面包店。那栋大楼的3楼有韩语学院，地下1层有美味的美食街。房子后面有宽敞的公园和美术馆，每周末去散步真的很好。", "grammar": "重点方位词：앞（前）、뒤（后）、옆（旁）、사이（之间）、건너편（对面）、근처（附近）"}, {"unitId": "1A-5", "label": "1A 第5课 时间星期", "title": "지난주와 이번 주 계획 (上周与本周计划)", "ko": "지난주 수요일에는 한국어 시험을 봤습니다. 시험이 끝나고 금요일 저녁에는 명동에서 친구를 만났습니다. 토요일에는 백화점에서 쇼핑을 했고, 일요일에는 집에서 밀린 빨래와 방 청소를 하면서 푹 쉬었습니다. 어제는 월요일이라서 수업이 많았지만, 오늘은 화요일이라서 오후에 시간이 좀 있습니다. 이번 주 목요일에는 공원에서 산책할 예정이고, 모레부터는 가족들과 함께 부산으로 여행을 갈 것입니다.", "zh": "上周三考了韩语试。考完试后，周五晚上在明洞见了朋友。周六在百货商店购了物，周日在家洗了积攒的衣服、打扫了房间，好好休息了一下。昨天是星期一，所以课很多；但今天是星期二，下午有点时间。本周四打算在公园散步，从后天开始要和家人一起去釜山旅行。", "grammar": "重点时制：-았/었어요（过去时）、-(으)ㄹ 거예요 / -(으)ㄹ 예정이다（将来时/打算）"}, {"unitId": "1A-6", "label": "1A 第6课 数字购物", "title": "시장과 마트에서 쇼핑하기 (在市场和超市购物)", "ko": "오늘 오후에 집 근처에 있는 큰 시장에 갔습니다. 요즘 봄이라서 딸기가 아주 싸고 맛있었습니다. 저는 딸기 한 팩과 사과 다섯 개, 그리고 포도 두 송이를 샀습니다. 모두 합해서 만 오천 원이었습니다. 그다음에 마트에 들러서 우유 두 병과 오렌지 주스 한 병을 샀습니다. 마트에서는 지금 세일 할인 중이라서 가격이 아주 쌌습니다. 현금으로 계산하고 영수증을 받은 후에 기분 좋게 집으로 돌아왔습니다.", "zh": "今天下午去了家附近的大市场。最近是春天，所以草莓又便宜又好吃。我买了一盒草莓、五个苹果，还有两串葡萄。一共是一万五千韩元。接着顺路去超市买了两瓶牛奶和一瓶橙汁。超市现在正在打折促销，所以价格非常便宜。用现金结账并拿了收据后，心情愉快地回家了。", "grammar": "重点数量词：固有数词 + 个/瓶/杯/只（개, 병, 잔, 마리）；汉字数词 + 韩元/楼层（원, 층）"}, {"unitId": "1A-7", "label": "1A 第7课 天气季节", "title": "한국의 사계절 날씨 (韩国的四季天气)", "ko": "한국은 봄, 여름, 가을, 겨울 사계절이 뚜렷합니다. 봄에는 날씨가 따뜻하고 벚꽃이 활짝 핍니다. 여름에는 낮 기온이 30도까지 올라가서 아주 덥고 습합니다. 특히 7월에는 장마철이라서 비가 자주 내립니다. 가을에는 하늘이 맑고 바람이 시원해서 여행하기에 가장 좋습니다. 산마다 예쁜 단풍도 구경할 수 있습니다. 겨울에는 날씨가 매우 춥고 눈이 많이 옵니다. 사계절 중에서 저는 시원한 가을을 제일 좋아합니다.", "zh": "韩国春、夏、秋、冬四季分明。春天天气温暖，樱花盛开。夏天白天气温升到30度，非常炎热潮湿。特别是7月是梅雨季，经常下雨。秋天天气晴朗、秋风凉爽，最适合旅行。每座山都能欣赏到漂亮的红叶。冬天天气非常冷，经常下雪。四季之中我最喜欢凉爽的秋天。", "grammar": "重点句型：-기(에) 좋다（适合做某事）、-아서/어서（原因）、불규칙 활용（ㅂ不规则：덥다→더워요, 춥다→추워요）"}, {"unitId": "1A-8", "label": "1A 第8课 提议爱好", "title": "주말 취미 생활 (周末爱好生活)", "ko": "제 취미는 사진 찍기와 독서입니다. 평일에는 공부가 바빠서 시간이 별로 없지만, 주말에는 여가 시간을 즐깁니다. 날씨가 좋은 날에는 카메라를 들고 공원에 나가서 꽃과 풍경 사진을 찍습니다. 가끔 친구들과 같이 배드민턴을 치거나 자전거도 탑니다. 비가 오는 날에는 집에서 조용히 책을 읽거나 한국 영화를 봅니다. 이번 주 토요일에 특별한 약속이 없으면 우리 같이 사진 전시회에 갈까요?", "zh": "我的爱好是拍照和读书。平日因为学习忙没什么时间，但周末会享受空闲时间。天气好的日子里，我会拿着相机去公园拍花和风景照。偶尔也会和朋友们一起打羽毛球或骑自行车。下雨的日子就在家安静地看书或看韩国电影。这周六如果没有特别约会的话，我们一起去看摄影展好吗？", "grammar": "重点句型：-(으)ㄹ까요?（提议：……好吗？）、-거나（或者）、-(으)면（如果……的话）"}, {"unitId": "1B-9", "label": "1B 第9课 家人尊称", "title": "우리 가족 이야기 (我们家的故事)", "ko": "우리 가족은 할아버지, 할머니, 아버지, 어머니, 언니, 그리고 저까지 모두 여섯 명입니다. 할아버지와 할머니께서는 연세가 많으시지만 아주 건강하십니다. 지금 고향 댁에서 편하게 지내십니다. 아버지께서는 은행에서 일하시고, 어머니께서는 고등학교에서 학생들을 가르치십니다. 언니는 작년에 결혼해서 남편과 함께 부산에 살고 있습니다. 주말마다 부모님께 전화를 드리고 안부를 여쭙니다.", "zh": "我们家有爷爷、奶奶、爸爸、妈妈、姐姐，还有我，一共六口人。爷爷和奶奶虽然年纪大了，但非常健康，现在在老家舒心地生活。爸爸在银行工作，妈妈在高中教学生。姐姐去年结婚了，现在和丈夫一起住在釜山。每周末我都会给父母打电话问候。", "grammar": "重点敬语：께서（主格敬语助词）、-(으)시-（主体敬语词尾）、계시다/드시다/주무시다（特殊敬语动词）"}, {"unitId": "1B-10", "label": "1B 第10课 时间作息", "title": "바쁜 직장인의 하루 (忙碌上班族的一天)", "ko": "제 형은 무역 회사에 다니는 직장인입니다. 매일 새벽 6시 반에 일어나서 샤워를 하고 이를 닦습니다. 아침 7시 40분에 집에서 출발해서 지하철을 타고 8시 반까지 회사에 출근합니다. 오전 9시부터 회의를 시작하고, 낮 12시부터 1시까지는 점심시간입니다. 점심을 먹은 후에는 잠깐 산책을 합니다. 보통 저녁 6시에 퇴근하지만, 요즘은 프로젝트 때문에 밤 9시까지 야근을 자주 해서 조금 피곤합니다.", "zh": "我哥哥是在贸易公司上班的职员。每天凌晨6点半起床，洗澡刷牙。早上7点40分从家出发，坐地铁在8点半前到公司上班。上午9点开始开会，中午12点到1点是午休时间。吃完午饭后会散步一会儿。通常晚上6点下班，但最近因为项目经常加班到晚上9点，所以有点累。", "grammar": "重点句型：N부터 N까지（从……到……时间）、-은/ㄴ 후에（……之后）、-지만（虽然……但是……）"}, {"unitId": "1B-11", "label": "1B 第11课 身体医院", "title": "감기에 걸려서 병원에 갔어요 (感冒了去医院)", "ko": "어제 밤부터 갑자기 목이 아프고 열이 많이 났습니다. 아침에 일어나니까 콧물도 나고 기침도 계속 났습니다. 그래서 오전에 집 근처에 있는 내과 병원에 갔습니다. 의사 선생님께서 진찰을 하신 후에 심한 감기라고 말씀하셨습니다. 병원에서 주사를 한 대 맞고 처방전을 받았습니다. 약국에 가서 3일 치 약을 샀습니다. 약사 선생님께서 식후 30분에 약을 먹고 따뜻한 물을 많이 마시면서 푹 쉬라고 하셨습니다.", "zh": "从昨晚开始突然嗓子疼，还发了高烧。早上起床后又流鼻涕又一直咳嗽。所以上午去了家附近的内科医院。医生诊断后说是重感冒。在医院打了一针并拿了处方单，去药店买了3天份的药。药剂师叮嘱我饭后30分钟吃药，多喝温水，好好休息。", "grammar": "重点句型：-아서/어서（动作先后/原因）、-(으)라고 하다（间接引语：叮嘱/命令做某事）"}, {"unitId": "1B-12", "label": "1B 第12课 打电话", "title": "사무실로 걸려 온 전화 (打到办公室的电话)", "ko": "“여보세요, 거기 한국무역이지요? 김 과장님 좀 바꿔 주세요.” “죄송합니다. 과장님께서는 지금 외출하셔서 자리에 안 계십니다. 3시쯤 들어오실 예정인데, 메모 남겨 드릴까요?” “네, 그럼 오후에 다시 전화하겠다고 전해 주세요. 제 전화번호는 010-1234-5678입니다.” 전화를 끊은 후에 저는 과장님 책상 위에 메모를 남기고, 카톡 메시지로도 연락드렸습니다.", "zh": "“喂，请问是韩国贸易公司吗？请帮我转接一下金科长。”“不好意思，科长现在外出了，不在座位上。预计3点左右回来，要帮您留个便条吗？”“好的，那请转告他我下午再打过来。我的电话号码是010-1234-5678。”挂断电话后，我在科长桌上留了便条，也通过KakaoTalk消息联系了他。", "grammar": "重点电话表达：여보세요（喂）、-좀 바꿔 주세요（请转接……）、자리에 없다（不在座位上）、전화를 끊다（挂电话）"}, {"unitId": "1B-13", "label": "1B 第13课 交通问路", "title": "서울역 찾아가기 (寻找首尔站)", "ko": "주말에 기차를 타고 부산에 가기 위해 서울역에 갔습니다. 처음 가는 길이라서 지하철역 출구 앞에서 경찰관에게 길을 물어보았습니다. 경찰관께서 “이 길로 똑바로 가다가 첫 번째 사거리에서 오른쪽으로 도세요. 그다음에 횡단보도를 건너면 바로 서울역이 보입니다.”라고 친절하게 알려 주셨습니다. 금요일 저녁이라서 차가 많고 길이 조금 막혔지만, 지하철을 타고 2호선에서 1호선으로 갈아탄 덕분에 제시간에 도착할 수 있었습니다.", "zh": "周末为了坐火车去釜山，去了首尔站。因为是第一次走的路，在地铁站出口前向警察问了路。警察亲切地告诉我：“顺着这条路一直走，在第一个十字路口往右转。然后过了人行横道就能看到首尔站了。”虽然是周五晚上车多有点堵，但多亏坐地铁从2号线换乘了1号线，得以准时到达。", "grammar": "重点指路句型：-다가（动作转换）、-(으)면（如果……就……）、-(으)ㄹ 수 있다（能够/可以）"}, {"unitId": "1B-14", "label": "1B 第14课 服装外貌", "title": "백화점에서 옷 고르기 (在百货商店挑衣服)", "ko": "다음 주에 친구 결혼식이 있어서 백화점에 옷을 사러 갔습니다. 저는 깔끔한 하얀색 셔츠와 검은색 바지를 입어 보았습니다. 바지가 조금 길었지만 점원분께서 무료로 길이를 수선해 주셨습니다. 또 파란색 넥타이와 구두도 같이 샀습니다. 거울을 보니까 옷이 저한테 아주 잘 어울렸고, 구두도 오래 걸어도 발이 편했습니다. 날씨가 쌀쌀해지면 따뜻한 코트와 목도리도 하나 장만할 생각입니다.", "zh": "下周有朋友的婚礼，所以去百货商店买衣服。我试穿了干练的白衬衫和黑裤子。裤子虽然有点长，但店员免费帮我修改了长度。还一起买了蓝色领带和皮鞋。照了照镜子，衣服非常适合我，皮鞋走再久脚也很舒服。等天气变凉了，我还打算置办一件暖和的大衣和围巾。", "grammar": "重点服装动词：입다（穿衣）、신다（穿鞋袜）、쓰다（戴帽/镜）、끼다（戴手套/戒指）、매다（系领带/围巾）"}, {"unitId": "1B-15", "label": "1B 第15课 旅行计划", "title": "설레는 제주도 여행 계획 (令人激动的济州岛旅行计划)", "ko": "이번 여름방학에 친구와 함께 3박 4일 동안 제주도에 여행을 갈 계획입니다. 어제 인터넷으로 비행기 표와 바다가 보이는 호텔을 미리 예약했습니다. 제주도에 도착하면 먼저 한라산에 올라가서 아름다운 경치를 구경하고, 에메랄드빛 바다에서 수영도 할 것입니다. 또 관광 안내소에서 지도를 받아서 유명한 박물관과 감귤 농장에도 가 보려고 합니다. 가족들에게 줄 특산물과 기념품도 많이 사서 잊지 못할 좋은 추억을 만들고 싶습니다.", "zh": "这个暑假我计划和朋友一起去济州岛进行4天3夜的旅行。昨天在网上提前预订了机票和海景酒店。到达济州岛后，首先要登上汉拿山欣赏美丽的风景，还要在翡翠般的大海里游泳。另外还打算在旅游咨询处领张地图，去有名的博物馆和橘子农场看看。也想买很多送给家人的特产和纪念品，留下难忘的美好回忆。", "grammar": "重点句型：-(으)려고 하다（打算做某事）、-아/어 보다（尝试做某事）、-고 싶다（想做某事）"}, {"unitId": "1B-16", "label": "1B 第16课 餐厅点餐", "title": "한국 식당에서 저녁 식사 (在韩国餐厅吃晚饭)", "ko": "오늘 저녁에 한국 친구와 함께 학교 앞 유명한 한식당에 갔습니다. 자리에 앉아서 메뉴판을 본 후에 불고기 2인분과 비빔밥, 그리고 김치찌개를 주문했습니다. 음식이 나오기 전에 맛있는 반찬이 여섯 가지나 나왔습니다. 김치찌개는 조금 매웠지만 국물이 아주 시원했고, 불고기는 달콤하고 부드러워서 정말 맛있었습니다. 우리는 숟가락과 젓가락으로 배가 부를 때까지 맛있게 먹었습니다. 식사를 마친 후에는 제가 오늘 저녁값을 계산했습니다.", "zh": "今天晚上和韩国朋友一起去了学校前面有名的韩餐厅。入座看了菜单后，点了两人份烤肉、拌饭，还有泡菜汤。主菜上来之前，先上了足足六种美味的小菜。泡菜汤虽然有点辣但汤汁非常鲜美，烤肉甜嫩可口，真的很好吃。我们用勺子和筷子吃得饱饱的。吃完饭后，今天由我来结了晚饭钱。", "grammar": "重点点餐表达：N 인분（N人份）、-기 전에（……之前）、-을/ㄹ 때까지（直到……为止）"}]};
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const storeKey="korean-study-1a1b-v1";
let state={};
try{state=JSON.parse(localStorage.getItem(storeKey)||"{}")}catch(e){state={}}
state.learned ||= {}; state.dict ||= {}; state.read ||= {};
let tab="vocab", unitId="1A-1", wordFilter="全部", searchTerm="", currentWord=null, revealed=false;
const allWords=()=>DATA.units.flatMap(u=>u.words.map((w,i)=>({...w,unitId:u.id,unitTitle:u.title,index:i})));
const words=allWords();
function save(){localStorage.setItem(storeKey,JSON.stringify(state));updateStats()}
function updateStats(){
 $("#totalWords").textContent=words.length;
 $("#learnedCount").textContent=Object.values(state.learned).filter(Boolean).length;
 $("#dictCount").textContent=Object.values(state.dict).reduce((a,b)=>a+(b||0),0);
 $("#readCount").textContent=Object.values(state.read).filter(Boolean).length+"/16";
}
function unitOptions(){return DATA.units.map(u=>`<option value="${u.id}" ${u.id===unitId?"selected":""}>${esc(u.title)}</option>`).join("")}
function chips(book){return DATA.units.filter(u=>!book||u.book===book).map(u=>`<button class="chip ${unitId===u.id?"active":""}" data-unit="${u.id}">${u.book} · 第${u.number}课</button>`).join("")}
function switchTab(t){tab=t;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));
function speak(text){if(!("speechSynthesis" in window)){alert("当前浏览器不支持语音朗读。");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="ko-KR";u.rate=.82;let voices=speechSynthesis.getVoices();let v=voices.find(x=>x.lang.toLowerCase().startsWith("ko"));if(v)u.voice=v;speechSynthesis.speak(u)}
function render(){
 updateStats();
 if(tab==="vocab")renderVocab();
 if(tab==="dict")renderDict();
 if(tab==="reading")renderReading();
 if(tab==="progress")renderProgress();
}
function renderVocab(){
 let unit=DATA.units.find(u=>u.id===unitId)||DATA.units[0];
 let list=unit.words.filter(w=>(wordFilter==="全部"||w.source.includes(wordFilter))&&(`${w.ko} ${w.zh} ${w.pos}`).toLowerCase().includes(searchTerm.toLowerCase()));
 $("#main").innerHTML=`<section class="panel"><div class="section-head"><div><h3>单词学习</h3><div class="sub">按教材单元学习，点击发音并查看例句</div></div><select id="unitSelect">${unitOptions()}</select></div><div class="unit-chips">${chips(unit.book)}</div><div class="controls"><input class="control" id="search" placeholder="搜索韩语、中文或词性…" value="${esc(searchTerm)}"><select id="wordFilter"><option>全部</option><option ${wordFilter==="核心词汇"?"selected":""}>核心词汇</option><option ${wordFilter==="拓展词汇"?"selected":""}>拓展词汇</option></select></div><div class="section-head"><div><b>${esc(unit.title)}</b><div class="sub">${unit.words.length} 个词 · 核心词与主题拓展词</div></div><span class="meta">${list.length} 条结果</span></div><div class="word-list">${list.map(w=>{let id=unit.id+"|"+w.ko;return `<article class="word-card"><div class="word-top"><div><div class="korean">${esc(w.ko)}</div><div class="pron">${esc(w.pron&&w.pron!=="-"?"读音 "+w.pron:"")} · ${esc(w.pos)}</div></div><span class="meta">${w.source.includes("拓展")?"拓展":"核心"}</span></div><div class="meaning">${esc(w.zh)}</div><div class="example">${esc(w.example)}</div><div class="word-actions"><button class="mini" data-speak="${esc(w.ko)}">🔊 发音</button><button class="mini ${state.learned[id]?"done":""}" data-learn="${esc(id)}">${state.learned[id]?"✓ 已掌握":"标记掌握"}</button><button class="mini" data-dict="${esc(id)}">去听写</button></div></article>`}).join("")||'<div class="empty">没有找到符合条件的单词</div>'}</div></section>`;
 $("#unitSelect").onchange=e=>{unitId=e.target.value;searchTerm="";render()};
 $("#search").oninput=e=>{searchTerm=e.target.value;let p=e.target.selectionStart;renderVocab();let el=$("#search");el.focus();el.setSelectionRange(p,p)};
 $("#wordFilter").onchange=e=>{wordFilter=e.target.value;render()};
 document.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{unitId=b.dataset.unit;render()});
 document.querySelectorAll("[data-speak]").forEach(b=>b.onclick=()=>speak(b.dataset.speak));
 document.querySelectorAll("[data-learn]").forEach(b=>b.onclick=()=>{state.learned[b.dataset.learn]=!state.learned[b.dataset.learn];save();render()});
 document.querySelectorAll("[data-dict]").forEach(b=>b.onclick=()=>{let [uid,ko]=b.dataset.dict.split("|");unitId=uid;currentWord=words.find(w=>w.unitId===uid&&w.ko===ko);switchTab("dict")});
}
function renderDict(){
 $("#main").innerHTML=`<section class="panel"><div class="section-head"><div><h3>单词听写</h3><div class="sub">先听发音，再用 Apple Pencil / 手指 / 鼠标写下韩语</div></div><select id="dictUnit">${unitOptions()}</select></div><div class="controls"><select id="dictSource"><option>全部词汇</option><option>核心词汇</option><option>拓展词汇</option><option>错词复习</option></select><button class="btn secondary" id="newQuestion">换一个单词</button></div><div class="dic-layout"><div class="question"><div class="hint">听音写词 · 当前单元</div><h2 id="dictPrompt">准备开始</h2><button class="btn" id="playWord">🔊 播放韩语发音</button><div id="answerBox" style="display:none;margin-top:18px"><div class="hint">正确答案</div><div class="answer" id="answerText"></div><div class="meta" id="answerMeaning"></div><div class="feedback" id="answerExample"></div><div class="word-actions"><button class="btn" id="markCorrect">我写对了</button><button class="btn warn" id="markWrong">写错了</button></div></div><button class="btn secondary" id="reveal" style="margin-top:16px">查看正确答案</button></div><div><div class="section-head"><div><b>手写答题区</b><div class="sub">建议使用 Apple Pencil 书写</div></div></div><div class="canvas-wrap"><canvas id="writeCanvas"></canvas></div><div class="canvas-tools"><button class="btn ghost" id="clearCanvas">清空重写</button><span class="meta">横屏或竖屏均可书写</span></div><div class="feedback">提示：浏览器网页暂不具备可靠的韩文手写自动识别。写完后查看答案，再点击“我写对了”或“写错了”，系统会记录结果并安排错词复习。</div></div></div></section>`;
 $("#dictUnit").onchange=e=>{unitId=e.target.value;currentWord=null;nextQuestion()};
 $("#dictSource").onchange=()=>nextQuestion();
 $("#newQuestion").onclick=nextQuestion;
 $("#playWord").onclick=()=>currentWord&&speak(currentWord.ko);
 $("#reveal").onclick=()=>revealAnswer();
 $("#clearCanvas").onclick=clearCanvas;
 $("#markCorrect").onclick=()=>markDict(true);
 $("#markWrong").onclick=()=>markDict(false);
 setupCanvas();
 if(!currentWord||currentWord.unitId!==unitId)nextQuestion();else showQuestion();
}
function nextQuestion(){
 let src=$("#dictSource")?.value||"全部词汇";
 let pool=words.filter(w=>w.unitId===unitId);
 if(src==="核心词汇")pool=pool.filter(w=>w.source.includes("核心"));
 if(src==="拓展词汇")pool=pool.filter(w=>w.source.includes("拓展"));
 if(src==="错词复习")pool=pool.filter(w=>(state.dict[w.unitId+"|"+w.ko]||0)>0);
 if(!pool.length){currentWord=null;$("#dictPrompt").textContent="这个筛选下暂时没有单词";$("#answerBox").style.display="none";return}
 let next=pool[Math.floor(Math.random()*pool.length)];
 if(pool.length>1&&currentWord&&next.ko===currentWord.ko)next=pool[(pool.indexOf(next)+1)%pool.length];
 currentWord=next;revealed=false;showQuestion();clearCanvas();
}
function showQuestion(){
 $("#dictPrompt").textContent="请听发音并写出单词";
 $("#answerBox").style.display="none";$("#reveal").style.display="inline-block";
}
function revealAnswer(){
 if(!currentWord)return;
 revealed=true;$("#answerText").textContent=currentWord.ko;$("#answerMeaning").textContent=currentWord.zh+" · "+currentWord.pos;
 $("#answerExample").textContent=currentWord.example;$("#answerBox").style.display="block";$("#reveal").style.display="none";
}
function markDict(ok){
 if(!currentWord)return;
 let id=currentWord.unitId+"|"+currentWord.ko;
 if(ok){state.dict[id]=0;state.learned[id]=true}else{state.dict[id]=(state.dict[id]||0)+1;state.learned[id]=false}
 save();nextQuestion();
}
function setupCanvas(){
 let c=$("#writeCanvas");if(!c)return;
 let ctx=c.getContext("2d"),drawing=false,last=null;
 function resize(){let rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1,h=rect.height;c.width=rect.width*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=3;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#263d31";ctx.fillStyle="#fff";ctx.fillRect(0,0,rect.width,h);ctx.beginPath();ctx.setLineDash([4,7]);ctx.strokeStyle="#e7ece8";ctx.moveTo(0,h/2);ctx.lineTo(rect.width,h/2);ctx.stroke();ctx.setLineDash([])}
 resize();window.addEventListener("resize",resize);
 function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
 c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);drawing=true;last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y)};
 c.onpointermove=e=>{if(!drawing)return;e.preventDefault();let p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};
 c.onpointerup=c.onpointercancel=()=>{drawing=false;last=null};
 window.clearCanvas=()=>resize();
}
function clearCanvas(){if(window.clearCanvas)window.clearCanvas()}
function renderReading(){
 let unit=DATA.units.find(u=>u.id===unitId)||DATA.units[0],reading=DATA.readings.find(r=>r.unitId===unit.id);
 $("#main").innerHTML=`<section class="panel"><div class="section-head"><div><h3>短文阅读</h3><div class="sub">每课一篇情景短文，结合本课核心词与拓展词</div></div><select id="readUnit">${unitOptions()}</select></div><div class="unit-chips">${chips(unit.book)}</div>${reading?`<article class="reading-card"><div class="meta">${esc(reading.label)}</div><h4>${esc(reading.title)}</h4><div class="reading-ko" id="readingText">${esc(reading.ko)}</div><div class="word-actions"><button class="btn" id="readAloud">🔊 播放全文</button><button class="btn secondary" id="toggleTranslation">显示中文翻译</button><button class="btn secondary" id="markRead">${state.read[unit.id]?"✓ 已完成阅读":"标记为已读"}</button></div><div id="translation" class="reading-zh" style="display:none;margin-top:12px">${esc(reading.zh)}</div><div class="grammar"><b>语法 / 表达提示</b><br>${esc(reading.grammar)}</div><div class="feedback">阅读建议：先不看中文独立读一遍；再听全文，最后对照翻译并复习不熟悉的单词。</div></article>`:'<div class="empty">当前单元暂时没有短文资料</div>'}</section>`;
 $("#readUnit").onchange=e=>{unitId=e.target.value;render()};
 document.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{unitId=b.dataset.unit;render()});
 if(reading){
 $("#readAloud").onclick=()=>speak(reading.ko);
 $("#toggleTranslation").onclick=()=>{let el=$("#translation"),show=el.style.display==="none";el.style.display=show?"block":"none";$("#toggleTranslation").textContent=show?"隐藏中文翻译":"显示中文翻译"};
 $("#markRead").onclick=()=>{state.read[unit.id]=!state.read[unit.id];save();render()};
 }
}
function renderProgress(){
 let unitRows=DATA.units.map(u=>{let n=u.words.length,done=u.words.filter(w=>state.learned[u.id+"|"+w.ko]).length,p=Math.round(done/n*100);return `<div class="progress-row"><span>${esc(u.book)} 第${u.number}课</span><div class="bar"><i style="width:${p}%"></i></div><span>${p}%</span></div>`}).join("");
 let wrong=words.filter(w=>(state.dict[w.unitId+"|"+w.ko]||0)>0);
 $("#main").innerHTML=`<section class="panel"><div class="section-head"><div><h3>学习统计</h3><div class="sub">记录保存在当前设备浏览器中</div></div></div><div class="progress-row"><span>单词掌握</span><div class="bar"><i style="width:${Math.round(Object.values(state.learned).filter(Boolean).length/words.length*100)}%"></i></div><span>${Math.round(Object.values(state.learned).filter(Boolean).length/words.length*100)}%</span></div><div class="progress-row"><span>短文阅读</span><div class="bar"><i style="width:${Object.values(state.read).filter(Boolean).length/16*100}%"></i></div><span>${Math.round(Object.values(state.read).filter(Boolean).length/16*100)}%</span></div><h4 style="margin:22px 0 8px">各单元掌握进度</h4>${unitRows}<div class="section-head" style="margin-top:24px"><div><b>错词复习</b><div class="sub">${wrong.length} 个需要重新练习的词</div></div></div>${wrong.length?`<div class="word-list">${wrong.slice(0,30).map(w=>`<div class="word-card"><b>${esc(w.ko)}</b><div class="meta">${esc(w.zh)} · 错 ${state.dict[w.unitId+"|"+w.ko]} 次</div><button class="mini" data-review="${esc(w.unitId)}|${esc(w.ko)}">去听写</button></div>`).join("")}</div>`:'<div class="feedback">目前没有错词记录，继续保持！</div>'}<div class="word-actions" style="margin-top:20px"><button class="btn" id="exportData">导出学习记录备份</button><button class="btn secondary" id="importBtn">导入学习记录</button><input type="file" id="importFile" accept="application/json" hidden></div></section>`;
 document.querySelectorAll("[data-review]").forEach(b=>b.onclick=()=>{let [uid,ko]=b.dataset.review.split("|");unitId=uid;currentWord=words.find(w=>w.unitId===uid&&w.ko===ko);switchTab("dict")});
 $("#exportData").onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="韩语学习记录备份.json";a.click();URL.revokeObjectURL(a.href)};
 $("#importBtn").onclick=()=>$("#importFile").click();
 $("#importFile").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());state={learned:x.learned||{},dict:x.dict||{},read:x.read||{}};save();render()}catch(err){alert("文件格式不正确，无法导入。")}};
}
render();updateStats();
</script></body></html>
